server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estaticos (index.html e o que mais for adicionado).
    location / {
        try_files $uri $uri/ =404;
    }

    # Tudo sob /api/ e repassado ao backend pela rede interna do compose.
    # "backend" e o nome do servico no compose.yaml, resolvido pelo DNS
    # interno do Docker. Este nome nao existe para o navegador.
    #
    # A barra no final de proxy_pass importa: com ela, /api/soma chega ao
    # backend como /soma. Sem ela, chegaria como /api/soma e daria 404.
    location /api/ {
        proxy_pass http://backend:5000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}